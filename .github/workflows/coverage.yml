# Покрытие тестами (только цифры, без порога): раз в неделю и по кнопке «Run workflow».
# Отдельно от CI, чтобы не удлинять проверку каждого коммита. Итог виден на странице запуска (Summary).
# Считаются тесты сервера без базы (backend/test) и тесты сайта (frontend/test); тесты из tests/ сюда не входят.
name: Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  coverage:
    name: Покрытие (сервер и сайт)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Пакеты сайта и сервера
        run: |
          npm --prefix frontend ci
          npm --prefix backend ci
          npm --prefix backend run db:generate

      - name: Покрытие сервера
        run: |
          set -o pipefail
          npm --prefix backend run test:coverage 2>&1 | tee backend-coverage.txt

      - name: Покрытие сайта
        run: |
          set -o pipefail
          npm --prefix frontend run test:coverage 2>&1 | tee frontend-coverage.txt

      - name: Итог
        if: always()
        run: |
          for part in backend frontend; do
            echo "### Покрытие: $part" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E '^(Statements|Branches|Functions|Lines) ' "$part-coverage.txt" >> "$GITHUB_STEP_SUMMARY" || echo 'цифр нет: смотри журнал шага' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
