# Автопроверки: на каждый push в main и на каждый pull request GitHub сам ставит пакеты, проверяет типы, собирает сайт (Nuxt),
# запускает все тесты и смотрит боевые зависимости на известные уязвимости. Результат виден у коммита (зелёная галочка или красный крестик).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Проверка (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/korean_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/korean_test
      REDIS_URL: redis://localhost:6379
      MEILISEARCH_URL: http://localhost:7700
      MEILISEARCH_MASTER_KEY: ci-meilisearch-master-key
      RUN_SMTP_INTEGRATION: '1'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: korean_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d korean_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep -q PONG"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.12
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: ci-meilisearch-master-key
        ports:
          - 7700:7700
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:7700/health | grep -q available"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        # Node 22: ровно та версия, что в образах Docker на сервере (docker/*/Dockerfile).
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Пакеты тестов, сайта и сервера
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix backend ci
          node scripts/link-test-deps.mjs

      - name: Клиент и схема Prisma
        run: |
          npm --prefix backend run db:generate
          npm --prefix backend run db:migrate

      - name: Клиент PostgreSQL для проверки резервных копий
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Проверка готовности Meilisearch
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent -H "Authorization: Bearer $MEILISEARCH_MASTER_KEY" "$MEILISEARCH_URL/health"; then
              exit 0
            fi
            sleep 2
          done
          echo "Meilisearch не ответил вовремя" >&2
          exit 1

      - name: Линтер (ошибки в коде и забытый await)
        run: npm run lint

      - name: Типы сайта
        run: npm --prefix frontend run type-check

      - name: Сборка сайта
        run: npm --prefix frontend run build

      - name: Тесты (собирают сервер и запускают все проверки)
        run: npm test

      - name: Уязвимости в боевых зависимостях
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix frontend audit --omit=dev --audit-level=high
          npm --prefix backend audit --omit=dev --audit-level=high

  docker:
    name: Docker (сборка образов и конфигурация стека)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Проверка docker-compose.yml с образцом настроек
        run: |
          bash scripts/init-env.sh
          docker compose config --quiet
          docker compose --profile edge config --quiet

      - name: Сборка образов сайта и сервера
        run: docker compose build

      - name: Сервер стартует на пустой базе (миграции, health)
        run: |
          docker compose up -d postgres redis meilisearch docker-proxy
          docker compose up -d --wait backend
          curl -fsS http://127.0.0.1:3001/api/health
          docker compose logs --tail 30 backend
          docker compose down -v

