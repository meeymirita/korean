# Раз в неделю GitHub сам предлагает обновления пакетов отдельными pull request-ами; автопроверки (ci.yml) сразу показывают, не сломалось ли что-то.
# TypeScript 7 пока не обновляем (проверено 2026-11-17): `nest build` требует программный интерфейс компилятора, которого у TypeScript 7 нет,
# а `vue-tsc` не находит `typescript/lib/tsc`. Снять запрет, когда @nestjs/cli и vue-tsc объявят поддержку TypeScript 7.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
