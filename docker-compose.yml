services:
  backend:
    image: ${BACKEND_IMAGE}
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      docker-proxy:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    volumes:
      - app-data:/data
      # .env и инструкции попадают в полный архив (секреты, как вернуть на новом сервере)
      - ./.env:/app/.env:ro
      - ./docs:/app/docs:ro
    # наружу только на loopback: сайт открывает Caddy (хостовый или профиль edge), напрямую API из интернета не виден
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    networks: [app, data, monitoring, docker-ops]
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      TZ: ${TZ}
      DATA_DIR: /data
      TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}
      DOCKER_API_URL: http://docker-proxy:2375
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}
      PROGRESS_TOKEN: ${PROGRESS_TOKEN:?Set PROGRESS_TOKEN in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      CHAT_BASE: ${CHAT_BASE:-https://openrouter.ai/api/v1}
      CHAT_DAILY_LIMIT: ${CHAT_DAILY_LIMIT:-40}
      SITE_URL: ${SITE_URL:-https://localhost}
      SWAGGER: ${SWAGGER:-0}
      DISABLE_2FA: ${DISABLE_2FA:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      REMINDER_MAIL_TO: ${REMINDER_MAIL_TO:-}
      BACKUP_MAIL_TO: ${BACKUP_MAIL_TO:-}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_AUTO: ${BACKUP_AUTO:-1}
      BACKUP_EVERY_DAYS: ${BACKUP_EVERY_DAYS:-1}
      BACKUP_WATCH_MS: ${BACKUP_WATCH_MS:-3600000}
      BACKUP_DIR: ${BACKUP_DIR:-}
      KEEP: ${KEEP:-14}
      KEEP_OFFSITE_DAYS: ${KEEP_OFFSITE_DAYS:-30}
      OFFSITE_RSYNC: ${OFFSITE_RSYNC:-}
      OFFSITE_RCLONE: ${OFFSITE_RCLONE:-}
      LESSON_TICK_MS: ${LESSON_TICK_MS:-60000}
      MAIL_DUMP_FILE: ${MAIL_DUMP_FILE:-}
      DOCS_QUOTA_MB: ${DOCS_QUOTA_MB:-1024}
      IMAGES_QUOTA_MB: ${IMAGES_QUOTA_MB:-1024}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE}
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      args:
        API_HOST: ${FRONTEND_API_HOST}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks: [app]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Необязательный вход «всё в одном» (HTTPS, заголовки, видео): docker compose --profile edge up -d.
  # На сервере, где уже стоит свой Caddy, не нужен: он сам ходит на 127.0.0.1:3000 и :3001.
  caddy:
    image: ${CADDY_IMAGE}
    profiles: [edge]
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${VIDEO_DIR:-./docker/caddy/video}:/srv/video:ro
      - caddy-logs:/var/log/caddy
      - caddy-data:/data
      - caddy-config:/config
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION}
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks: [monitoring]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: ${GRAFANA_IMAGE}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3002}
      # при входе сразу открывается панель нагрузки, а не пустая стартовая страница Grafana
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/operations.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    expose: ["3000"]
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    networks: [monitoring]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
      - app-data:/textfile:ro
    expose: ["9100"]
    networks: [monitoring]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/metrics >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  docker-proxy:
    image: ${DOCKER_PROXY_IMAGE}
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      PING: 1
      VERSION: 1
      EVENTS: 0
      POST: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - ${DOCKER_SOCKET_PATH}:/var/run/docker.sock:ro
    expose: ["2375"]
    networks: [docker-ops]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data]

  redis:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    expose: ["6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [data]

  meilisearch:
    image: ${MEILISEARCH_IMAGE}
    restart: unless-stopped
    environment:
      MEILI_ENV: ${MEILI_ENV}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - meilisearch-data:/meili_data
    # порт на loopback нужен только для поддомена search.korean… за паролем Caddy (docs/docker.md); приложение ходит по сети data
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    networks: [data, monitoring]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Authorization: Bearer '$$MEILI_MASTER_KEY http://127.0.0.1:7700/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  app-data:
  caddy-logs:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
  postgres-data:
  redis-data:
  meilisearch-data:

networks:
  app:
  monitoring:
  docker-ops:
    internal: true
  data:
    internal: true
