<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>После героев — Фрирен</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;600&family=Noto+Serif+JP&family=Space+Mono&display=swap" rel="stylesheet">
<meta name="yandex-verification" content="7e91f055e8c3fe9f" />
<style>
  :root { --bg:#f4f3f0; --ink:#2b2a27; --muted:#5b5850; --gold:#a8822f; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); }
  body { font-family:'Manrope',sans-serif; color:var(--ink); }
  a { color:inherit; text-decoration:none; }

  .hero { position:relative; width:100%; height:100vh; min-height:640px; overflow:hidden; }
  .hero > img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    object-position:52% 40%; transform:scale(1.25); transform-origin:52% 40%; }
  .shade { position:absolute; left:0; top:0; bottom:0; width:min(520px,60%);
    background:linear-gradient(90deg, rgba(244,243,240,.85) 55%, rgba(244,243,240,0)); }

  .side { position:relative; width:min(420px,100%); height:100%; padding:56px;
    display:flex; flex-direction:column; justify-content:center; gap:26px; }
  .jp { font-family:'Noto Serif JP',serif; font-size:13px; letter-spacing:.35em; color:var(--gold); }
  h1 { margin:6px 0 0; font-family:'Cormorant Garamond',serif; font-weight:600;
    font-size:70px; line-height:.95; }

  nav { display:flex; flex-direction:column; }
  nav a { display:flex; align-items:center; gap:14px; padding:8px 0; font-size:15px; font-weight:600;
    transition:color .2s, padding-left .2s; }
  nav a:hover { color:var(--gold); padding-left:8px; }
  nav .line { width:18px; height:1px; background:var(--gold); }
  nav .num { margin-left:auto; font-family:'Space Mono',monospace; font-size:11px; opacity:.5; }

  .quote { position:absolute; right:48px; bottom:48px; width:min(440px, calc(100% - 96px));
    padding:28px 30px 24px; border-radius:16px; background:rgba(248,247,244,.9);
    box-shadow:0 30px 60px -30px rgba(40,38,34,.45);
    display:flex; flex-direction:column; gap:14px; }
  .counter { display:flex; align-items:center; gap:10px; font-family:'Space Mono',monospace;
    font-size:11px; letter-spacing:.2em; color:var(--gold); }
  .counter::before { content:""; width:18px; height:1px; background:var(--gold); }
  #q { font-family:'Cormorant Garamond',serif; font-weight:600; font-size:28px; line-height:1.15; text-wrap:pretty; }
  #c { font-size:13px; line-height:1.55; color:var(--muted); text-wrap:pretty; }

  .controls { display:flex; align-items:center; gap:8px; padding-top:4px; }
  .arrow { width:36px; height:36px; border-radius:50%; border:1px solid var(--gold); background:transparent;
    color:var(--ink); display:grid; place-items:center; cursor:pointer; transition:background .2s, color .2s; }
  .arrow:hover { background:var(--gold); color:#fff; }
  .arrow svg { width:16px; height:16px; }
  .dots { display:flex; gap:6px; margin-left:auto; }
  .dots button { height:6px; width:6px; border-radius:3px; border:none; padding:0; cursor:pointer;
    background:rgba(43,42,39,.25); transition:width .25s, background .25s; }
  .dots button.active { width:20px; background:var(--gold); }

  @media (max-width:720px) {
    .side { padding:32px 24px; justify-content:flex-start; padding-top:48px; }
    h1 { font-size:52px; }
    .shade { width:100%; background:linear-gradient(180deg, rgba(244,243,240,.9) 45%, rgba(244,243,240,0)); }
    .quote { right:16px; left:16px; bottom:16px; width:auto; padding:20px; }
    #q { font-size:22px; }
  }
</style>
</head>
<body>
<div class="hero">
  <img src="frieren.png" alt="">
  <div class="shade"></div>

  <div class="side">
    <div>
      <div class="jp">勇者の後</div>
      <h1>После<br>героев</h1>
    </div>
    <nav id="nav"></nav>
  </div>

  <div class="quote">
    <div class="counter">ЦИТАТА <span id="qn">1</span> / <span id="qt">7</span></div>
    <span id="q"></span>
    <span id="c"></span>
    <div class="controls">
      <button class="arrow" id="prev" aria-label="Назад">
        <svg viewBox="0 0 256 256" fill="currentColor"><path d="M224 128a8 8 0 0 1-8 8H59.31l58.35 58.34a8 8 0 0 1-11.32 11.32l-72-72a8 8 0 0 1 0-11.32l72-72a8 8 0 0 1 11.32 11.32L59.31 120H216a8 8 0 0 1 8 8Z"/></svg>
      </button>
      <button class="arrow" id="next" aria-label="Вперёд">
        <svg viewBox="0 0 256 256" fill="currentColor"><path d="M221.66 133.66l-72 72a8 8 0 0 1-11.32-11.32L196.69 136H40a8 8 0 0 1 0-16h156.69l-58.35-58.34a8 8 0 0 1 11.32-11.32l72 72a8 8 0 0 1 0 11.32Z"/></svg>
      </button>
      <div class="dots" id="dots"></div>
    </div>
  </div>
</div>

<script>
  const AUTOPLAY = true;      // автопереключение цитат
  const INTERVAL = 9;         // секунд

  const menu = ["Главная","Персонажи","Эпизоды","Магия","Галерея","Музыка","Мир","Новости","Фан-арт","Контакты"];
  const quotes = [
    ["«Я хочу узнать о людях побольше. Даже если это займёт много лет».", "Эта фраза показывает поворот в её характере: после смерти Химмеля Фрирен осознанно решает не просто жить дальше, а вникнуть в человеческую природу — в то, что раньше она принимала как данность."],
    ["«Иногда самое важное — это не победа над врагом, а то, что мы делаем после».", "Здесь раскрывается её новая шкала ценностей: для Фрирен всё меньше важны битвы и «подвиги», и всё больше — то, как ты относишься к окружающим, даже в самых будничных делах."],
    ["«Магия — это не только сила. Это ещё и способ быть рядом с кем-то».", "Так Фрирен переосмысляет своё главное ремесло: магия становится не инструментом разрушения или демонстрации мощи, а формой заботы и поддержки."],
    ["«Даже если я не понимаю чьих-то чувств сразу, я могу постараться их запомнить».", "Очень важная фраза для её развития: она признаёт свою эмоциональную «медлительность» и берёт на себя труд учиться сопереживать, шаг за шагом."],
    ["«Прошлое не исчезает, если мы продолжаем о нём думать».", "В этой фразе — её отношение к памяти: Фрирен не пытается «забыть» ушедших, а делает воспоминания о них частью своего пути, потому что именно они формируют её решения и поступки."],
    ["«Чем дольше живёшь, тем важнее становятся короткие моменты».", "Парадоксальная, но очень глубокая мысль: для бессмертного эльфа ценность мгновений растёт именно из-за того, что человеческие жизни так коротки."],
    ["«Не нужно торопить время, чтобы не пропустить что-то важное».", "Это почти философия её путешествия: Фрирен учится замедляться, замечать детали и не считать «пустыми» те дни, когда ничего особенного не происходит."]
  ];

  // меню
  document.getElementById('nav').innerHTML = menu.map((t, k) =>
    `<a href="#"><span class="line"></span><span>${t}</span><span class="num">${String(k+1).padStart(2,'0')}</span></a>`).join('');

  // цитаты
  const $ = id => document.getElementById(id);
  const dots = $('dots');
  dots.innerHTML = quotes.map((_, k) => `<button aria-label="Цитата ${k+1}" data-i="${k}"></button>`).join('');
  $('qt').textContent = quotes.length;

  let i = 0, timer;
  function show(n) {
    i = (n + quotes.length) % quotes.length;
    $('q').textContent = quotes[i][0];
    $('c').textContent = quotes[i][1];
    $('qn').textContent = i + 1;
    [...dots.children].forEach((b, k) => b.classList.toggle('active', k === i));
  }
  function restart() {
    clearInterval(timer);
    if (AUTOPLAY) timer = setInterval(() => show(i + 1), INTERVAL * 1000);
  }
  $('prev').onclick = () => { show(i - 1); restart(); };
  $('next').onclick = () => { show(i + 1); restart(); };
  dots.onclick = e => { const b = e.target.closest('button'); if (b) { show(+b.dataset.i); restart(); } };
  document.querySelectorAll('nav a').forEach(a => a.addEventListener('click', e => e.preventDefault()));

  show(0); restart();
</script>
</body>
</html>
