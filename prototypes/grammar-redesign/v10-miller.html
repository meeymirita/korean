<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10 · Колонки</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;font:14px 'Noto Sans KR',-apple-system,system-ui,sans-serif;background:#e8e8ec;color:#1d1d1f}
.tb{height:46px;background:linear-gradient(#f6f6f8,#e4e4e8);border-bottom:1px solid #c5c5cb;display:flex;align-items:center;gap:12px;padding:0 14px}.dots i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}.path{flex:1;text-align:center;font-weight:600}.path span{opacity:.5}
.cols{flex:1;display:flex;min-height:0;background:#fff}.col{width:260px;flex:none;border-right:1px solid #d6d6db;overflow:auto;background:#fff}.col.s{background:#f5f5f8}
.it{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;border-radius:6px;margin:1px 6px}.it:hover{background:#ececf1}.it.sel{background:var(--c,#2f7bf6);color:#fff}.it i{width:10px;height:10px;border-radius:3px;background:var(--c)}.it.sel i{background:#fff}.it .ch{margin-left:auto;opacity:.45;font-size:12px}.it.ahead{opacity:.5;font-style:italic}.it small{opacity:.55}
.pv{flex:1;overflow:auto;padding:26px 36px;min-width:340px}.pv .icon{width:90px;height:90px;border-radius:20px;background:var(--c);color:#fff;display:grid;place-items:center;font:800 40px 'Noto Sans KR';margin-bottom:12px}.pv h1{margin:0;font-size:30px}.meta{display:grid;grid-template-columns:90px 1fr;font-size:13px;margin:12px 0 18px;border-top:1px solid #e3e3e8}.meta>*{padding:5px 0;border-bottom:1px solid #e3e3e8}.meta dt{opacity:.55}.meta dd{margin:0}
.status{height:26px;border-top:1px solid #c5c5cb;background:#f1f1f4;font-size:12px;display:flex;align-items:center;padding:0 14px;opacity:.7}
.gc{--line:#e3e3e8}
</style>
<div class="tb"><span class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></span><div class="path" id="path"></div></div>
<div class="cols" id="cols"></div><div class="status" id="st"></div>
<script src="data.js"></script><script src="common.js"></script>
<script>
const books=[{n:'Мои карточки · 1A',f:c=>!/^1B/.test(c.bk||'')},{n:'1B',f:c=>/^1B/.test(c.bk||'')}];
let sel=[null,null,null];const cols=$('#cols');
function render(){cols.innerHTML='';
 // колонка 1: разделы
 const c1=h('div',{class:'col s'});SECS.filter(s=>MINE.some(c=>c.s===s)).forEach(s=>{const n=MINE.filter(c=>c.s===s);const it=h('div',{class:'it'+(sel[0]===s?' sel':'')},[]);it.style.setProperty('--c',SEC_COL[SECS.indexOf(s)]);it.innerHTML=`<i></i>${esc(s)}<span class="ch">${n.filter(c=>!c.ahead).length}/${n.length} ›</span>`;it.onclick=()=>{sel=[s,null];render()};c1.append(it)});cols.append(c1);
 if(sel[0]){const c2=h('div',{class:'col'});MINE.filter(c=>c.s===sel[0]).forEach(c=>{const it=h('div',{class:'it'+(sel[1]===c?' sel':'')+(c.ahead?' ahead':'')});it.style.setProperty('--c',colOf(c));it.innerHTML=`<i></i><b>${esc(headKo(c))}</b><small>${esc(strip(c.ru).slice(0,22))}</small>`;it.onclick=()=>{sel[1]=c;render()};c2.append(it)});cols.append(c2)}
 if(sel[1]){const c=sel[1];const pv=h('div',{class:'pv gc'});pv.style.setProperty('--c',colOf(c));pv.innerHTML=`<div class="icon">${esc(headKo(c).slice(0,2))}</div><h1>${c.ko}</h1><dl class="meta"><dt>Что</dt><dd>${esc(strip(c.ru))}</dd><dt>Раздел</dt><dd>${esc(c.s)}</dd><dt>В книге</dt><dd>${esc(c.bk||'—')}</dd><dt>Статус</dt><dd>${c.ahead?'Впереди':'Пройдено'}</dd><dt>Формула</dt><dd>${F(formulaOf(c)||'—')}</dd></dl>`+(c.ahead?'':blocks(c));cols.append(pv)}
 $('#path').innerHTML=['Грамматика',sel[0],sel[1]&&sel[1].ko].filter(Boolean).map(esc).join(' <span>›</span> ');
 $('#st').textContent=sel[1]?'1 элемент выбран':sel[0]?`${MINE.filter(c=>c.s===sel[0]).length} элементов`:`${SECS.length} разделов`;cols.scrollLeft=1e5}
addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp','ArrowRight','ArrowLeft'].includes(e.key))return;e.preventDefault();const secs=SECS.filter(s=>MINE.some(c=>c.s===s));
 if(!sel[1]){let i=secs.indexOf(sel[0]);if(e.key==='ArrowDown')i=Math.min(secs.length-1,i+1);if(e.key==='ArrowUp')i=Math.max(0,i);if(e.key==='ArrowRight'&&sel[0]){sel[1]=MINE.find(c=>c.s===sel[0]);}else sel=[secs[Math.max(0,i)],null]}
 else{const list=MINE.filter(c=>c.s===sel[0]);let i=list.indexOf(sel[1]);if(e.key==='ArrowDown')i=Math.min(list.length-1,i+1);if(e.key==='ArrowUp')i=Math.max(0,i-1);if(e.key==='ArrowLeft'){sel[1]=null;render();return}sel[1]=list[i]}render()});
sel=[SECS[0],null];render();
</script></html>
