<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15 · Что хочешь сказать?</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-columns:1fr 340px;font-family:'Noto Sans KR',Archivo,system-ui,sans-serif;background:#eef1fb;color:#1c2140}
.chat{display:flex;flex-direction:column;min-height:0}.hd{padding:16px 26px;background:#fff;border-bottom:1px solid #dfe3f5;font-weight:800;display:flex;gap:10px;align-items:center}.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ff7eb6,#8f7cf0);display:grid;place-items:center;color:#fff}
#log{flex:1;overflow:auto;padding:24px 8vw;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.m{max-width:640px;padding:12px 16px;border-radius:20px;line-height:1.45;animation:pop .3s cubic-bezier(.2,1.2,.3,1)}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}
.bot{background:#fff;border-bottom-left-radius:5px;align-self:flex-start;box-shadow:0 2px 8px rgba(80,90,160,.1)}.me{background:linear-gradient(135deg,#8f7cf0,#e0559f);color:#fff;align-self:flex-end;border-bottom-right-radius:5px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}.o{border:2px solid var(--c,#8f7cf0);background:#fff;color:var(--c,#8f7cf0);border-radius:99px;padding:8px 15px;font:700 14px 'Noto Sans KR';cursor:pointer;transition:.15s}.o:hover{background:var(--c,#8f7cf0);color:#fff;transform:translateY(-2px)}.o small{opacity:.7;font-weight:500;margin-left:4px}.o.ahead{border-style:dashed;opacity:.5}
.form{font:800 20px 'Noto Sans KR';background:#1c2140;color:#fff;border-radius:14px;padding:10px 16px;margin:6px 0;--o:#ff9bb3;--b:#a8b6ff;--k:#ff8fcf}
.pair{display:flex;flex-direction:column;gap:6px}.pair .a,.pair .b{padding:8px 13px;border-radius:16px;max-width:90%;font-weight:700;font-size:17px}.pair .a{background:#f2efff;align-self:flex-start}.pair .b{background:#fff0f7;align-self:flex-end}.pair small{display:block;font:500 12px Archivo;opacity:.6}
.more{margin-top:8px}.gc{--line:#e3e6f6}.deepbox{margin-top:8px;border-top:1px dashed #cfd5f0;padding-top:6px}
aside{background:#fff;border-left:1px solid #dfe3f5;padding:20px;overflow:auto}aside h3{margin:0 0 10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.55}aside .n{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;margin-bottom:6px;background:#f5f6fd;cursor:pointer}aside .n i{width:10px;height:10px;border-radius:50%;background:var(--c)}aside .n b{font-size:14px}.reset{margin-top:12px;border:0;background:#1c2140;color:#fff;border-radius:99px;padding:8px 16px;cursor:pointer;font-weight:700}
</style>
<div class="chat"><div class="hd"><div class="av">✳︎</div>Сенсей-навигатор</div><div id="log"></div></div>
<aside><h3>Конспект диалога</h3><div id="notes"></div><button class="reset" onclick="start()">Начать заново</button></aside>
<script src="data.js"></script><script src="common.js"></script>
<script>
const INTENT={'Быть и отрицание':'Представиться, назвать, сказать «это не…»','Частицы':'Связать слова: кто, что, о чём','Место и направление':'Сказать, где что находится и куда иду','Глаголы и просьбы':'Рассказать, что делаю, или о чём-то попросить','Указатели и вопросы':'Показать «это / то» и задать вопрос','Вежливость':'Быть вежливым','Произношение':'Правильно прочитать вслух','Числительные':'Посчитать, назвать цену и количество','Время':'Сказать когда: час, день, прошлое, будущее','Желание и предложение':'Сказать «хочу» или предложить «давай»','Связки':'Соединить две мысли в одну'};
const log=$('#log'),notes=$('#notes');const say=(cls,html,delay=0)=>new Promise(r=>setTimeout(()=>{const m=h('div',{class:'m '+cls,html});log.append(m);log.scrollTop=1e6;r(m)},delay));
async function start(){log.innerHTML='';notes.innerHTML='';await say('bot','Привет! Я подберу правило. <b>Что ты хочешь сказать по-корейски?</b>');
 const m=await say('bot','<div class="opts"></div>',250);SECS.filter(s=>MINE.some(c=>c.s===s)).forEach(s=>{const b=h('button',{class:'o',onclick:()=>pickIntent(s)},[INTENT[s]||s]);b.style.setProperty('--c',colOf(MINE.find(c=>c.s===s)));$('.opts',m).append(b)})}
async function pickIntent(s){await say('me',INTENT[s]||s);const cs=MINE.filter(c=>c.s===s);await say('bot',`Для этого есть ${cs.filter(c=>!c.ahead).length} правил${cs.some(c=>c.ahead)?` (ещё ${cs.filter(c=>c.ahead).length} впереди)`:''}. Какое нужно?`,350);
 const m=await say('bot','<div class="opts"></div>',250);cs.forEach(c=>{const b=h('button',{class:'o'+(c.ahead?' ahead':''),onclick:()=>pickRule(c)},[]);b.style.setProperty('--c',colOf(c));b.innerHTML=`${esc(headKo(c))}<small>${esc(strip(c.ru).slice(0,26))}</small>`;$('.opts',m).append(b)})}
async function pickRule(c){await say('me',esc(c.ko));if(c.ahead){await say('bot','Эту тему ещё не проходили, поэтому покажу только её место в книге: <b>'+esc(c.bk||'—')+'</b>. Выбери другую?',350);return}
 notes.append(h('div',{class:'n',onclick:()=>pickRule(c),html:`<i style="--c:${colOf(c)};background:${colOf(c)}"></i><b>${esc(headKo(c))}</b>`}));
 await say('bot',F(ruleOf(c)),400);const f=formulaOf(c);if(f)await say('bot',`<div class="form">${F(f)}</div>`,350);
 const ex=examplesOf(c).slice(0,4);if(ex.length){const m=await say('bot','Вот как это звучит в разговоре:<div class="pair"></div>',350);ex.forEach((e,k)=>$('.pair',m).append(h('div',{class:k%2?'b':'a',html:`${F(e[0])}<small>${F(e[1])}</small>`})))}
 const m=await say('bot','<div class="opts"><button class="o" style="--c:#8f7cf0">Объясни глубже ↓</button><button class="o" style="--c:#e0559f">Другое правило</button></div>',350);const bs=$$('.o',m);
 bs[0].onclick=async()=>{bs[0].remove();await say('me','Объясни глубже');await say('bot',`<div class="gc">${blocks(c)}</div>`,350)};bs[1].onclick=()=>pickIntent(c.s)}
start();
</script></html>
