<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta http-equiv="refresh" content="15">
<title>우리말: сайт обновляется</title>
<style>
:root{--bg1:#f1eaff;--bg2:#dbeafe;--card:rgba(255,255,255,.72);--ink:#20265c;--soft:#5a6094;--pink:#d64da9;--line:rgba(32,38,92,.12)}
@media (prefers-color-scheme:dark){:root{--bg1:#14152b;--bg2:#1b2240;--card:rgba(32,34,64,.78);--ink:#e8e9ff;--soft:#a9acd6;--pink:#f07fc6;--line:rgba(232,233,255,.14)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--ink);font-family:Archivo,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;-webkit-text-size-adjust:100%}
main{width:100%;max-width:420px;padding:36px 24px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 40px rgba(32,38,92,.12)}
.mark{display:block;margin:0 auto 12px;font-size:44px;line-height:1;color:var(--pink);animation:spin 6s linear infinite}
.name{margin:0 0 20px;font-size:28px;font-weight:700;letter-spacing:.02em}
h1{margin:0 0 8px;font-size:20px;font-weight:700;line-height:1.3}
p{margin:0;font-size:16px;line-height:1.5;color:var(--soft)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.mark{animation:none}}
</style>
</head>
<body>
<main>
<span class="mark" aria-hidden="true">&#x2733;&#xFE0E;</span>
<div class="name">우리말</div>
<h1>Сайт обновляется, вернусь через минуту</h1>
<p>Страница обновится сама.</p>
</main>
</body>
</html>
