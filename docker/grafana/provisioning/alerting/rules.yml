# Тревоги Grafana (docs/docker.md, «Мониторинг»): сервер не отвечает, диск, старая копия, ошибки 5xx, ненайденные слова словаря.
# Файл собран руками; пороги меняются здесь, а не в интерфейсе Grafana (правила из файла там только для чтения).
apiVersion: 1

groups:
  - orgId: 1
    name: korean
    folder: Operations
    interval: 1m
    rules:
      - uid: korean-backend-down
        title: Сервер сайта не отвечает
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'up{job="backend"}'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: Alerting
        execErrState: Error
        for: 3m
        annotations:
          summary: "API не отвечает Prometheus дольше 3 минут. Смотри: docker compose ps, docker compose logs --tail 50 backend."

      - uid: korean-disk-full
        title: Диск заполнен больше чем на 85%
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'max(100 * (1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|zfs|apfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs|zfs|apfs"}))'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: gt, params: [85] }
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "На диске сервера занято больше 85%. Проверь копии в /var/backups/korean и образы Docker (docker system df)."

      - uid: korean-backup-old
        title: Копия базы старше двух дней
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'time() - max(backup_last_success_timestamp_seconds)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: gt, params: [172800] }
        noDataState: Alerting
        execErrState: Error
        for: 30m
        annotations:
          summary: "Последняя удачная копия базы сделана больше двух дней назад (или её не было). Смотри docs/backup.md: systemctl status korean-backup.timer."

      - uid: korean-5xx
        title: Растут ошибки сервера (5xx)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(increase(http_requests_total{status=~"5.."}[10m])) or vector(0)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: gt, params: [5] }
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "За 10 минут больше 5 ответов с ошибкой сервера. Смотри журнал: «Сервисы» в кабинете или docker compose logs --tail 100 backend."

      - uid: korean-dict-404
        title: Много ненайденных слов в словаре (404)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(increase(dict_word_not_found_total[1h])) or vector(0)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: gt, params: [30] }
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "За час больше 30 запросов слов, которых нет в словаре. Возможны битые адреса в карте сайта: BASE=https://korean.meeymirita.ru node scripts/check-sitemap.mjs."
